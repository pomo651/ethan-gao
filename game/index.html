<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shark Man's Treasure Dive — Ethan's Sketchbook</title>
  <meta name="description" content="100 coins, 10 shiny side up, and it's too dark to see. Sort them into two treasure chests and flip one. Can you make the shiny coins match?">
  <meta property="og:title" content="Can you solve Shark Man's Treasure Dive?">
  <meta property="og:description" content="100 coins. 10 shiny side up. Too dark to see. ONE flip. Make the two chests match.">
  <link rel="icon" href="../assets/img/avatar.jpg">
  <link rel="preload" href="../assets/fonts/patrick-hand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-root="../" data-page="game">
<div class="wrap">
  <nav data-nav></nav>

  <section class="dive" id="dive">
    <i class="dive-bub" style="left:6%;width:14px;height:14px"></i>
    <i class="dive-bub" style="left:44%;width:10px;height:10px;animation-delay:2.4s"></i>
    <i class="dive-bub" style="left:90%;width:18px;height:18px;animation-delay:4.6s"></i>

    <h1 class="dive-t">Shark Man's Treasure Dive</h1>
    <p class="dive-goal">🎯 Goal: make <strong>both chests</strong> have the <strong>same number of shiny coins</strong>.</p>

    <div class="dive-top">
      <svg class="dive-guide" id="guide" viewBox="0 0 240 180" aria-hidden="true">
        <path d="M108 58 L122 18 L140 60 Z" fill="#3b82f6" stroke="#0c4a6e" stroke-width="3"/>
        <path d="M44 96 L10 62 L22 100 L8 138 Z" fill="#3b82f6" stroke="#0c4a6e" stroke-width="3"/>
        <ellipse cx="118" cy="100" rx="82" ry="50" fill="#3b82f6" stroke="#0c4a6e" stroke-width="3"/>
        <path d="M60 112 Q120 150 186 112 Q160 136 120 138 Q84 138 60 112 Z" fill="#e0f2fe" stroke="#0c4a6e" stroke-width="3"/>
        <circle cx="166" cy="82" r="11" fill="#fff" stroke="#0c4a6e" stroke-width="3"/>
        <circle cx="169" cy="83" r="5" fill="#0c4a6e"/>
        <path d="M172 112 Q184 122 196 110" fill="none" stroke="#0c4a6e" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="dive-say" id="say" aria-live="polite"></div>
    </div>
    <button class="dive-read" type="button" id="readBtn">🔊 Read it to me</button>

    <div class="dive-steps">
      <div data-step="1"><span>🧰</span>1. Fill the chests</div>
      <div data-step="2"><span>🔄</span>2. Flip one chest</div>
      <div data-step="3"><span>🔦</span>3. Turn on the light</div>
    </div>

    <div class="dive-chests" id="board">
      <div class="dive-chest">
        <div class="dive-chest-h"><span class="dive-lbl">Left chest</span> <span class="dive-n" data-count="A">0 coins</span> <span class="dive-heads" data-heads="A"></span></div>
        <div class="dive-coins" data-coins="A"></div>
      </div>
      <div class="dive-chest">
        <div class="dive-chest-h"><span class="dive-lbl">Right chest</span> <span class="dive-n" data-count="B">100 coins</span> <span class="dive-heads" data-heads="B"></span></div>
        <div class="dive-coins" data-coins="B"></div>
      </div>
    </div>

    <div class="dive-acts" id="actions"></div>

    <div class="dive-pearls" id="pearls"></div>
  </section>

  <section class="dive-result" id="result" hidden></section>

  <p class="dad" style="margin-top:34px">You can try this with real coins too. Grab some from the jar, close your eyes, and have someone check.</p>

  <footer data-foot></footer>
</div>
<div class="g-confetti" id="confetti" aria-hidden="true"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/game.js"></script>
</body>
</html>
