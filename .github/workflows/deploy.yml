name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"   # daily, picks up new YouTube uploads
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refresh video list from YouTube
        # If YouTube is unreachable, keep the committed data/videos.json and still deploy.
        run: python3 scripts/update_videos.py || echo "::warning::Video refresh failed; using committed data/videos.json"

      - name: Stage public files
        run: |
          mkdir _site
          cp -R index.html 404.html assets data videos kits game about admin _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
